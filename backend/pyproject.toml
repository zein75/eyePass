[project]
name = "eyepass-backend"
version = "0.1.0"
description = "eyePass biometric access control вЂ” backend"
requires-python = ">=3.11"

dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy==2.0.35",
    "alembic==1.13.3",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "pgvector==0.3.5",
    "python-jose[cryptography]==3.3.0",
    "bcrypt==4.0.1",
    "celery==5.4.0",
    "redis==5.1.1",
    "httpx==0.27.2",
    "pydantic-settings==2.5.2",
    "pydantic[email]==2.9.2",
    "python-multipart==0.0.12",
    "opencv-python-headless==4.10.0.84",
    "requests==2.32.3",
    "Pillow==10.4.0",
    "python-dotenv==1.0.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
]

[tool.uv]
package = false
